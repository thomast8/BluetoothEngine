name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Parser tests
        run: swift test
      - name: Library for iOS
        run: xcodebuild -scheme BluetoothEngine -destination 'generic/platform=iOS' build
      - name: Library for watchOS
        run: xcodebuild -scheme BluetoothEngine -destination 'generic/platform=watchOS' build
